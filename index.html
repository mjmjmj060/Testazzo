<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#190d1d">
<title>Per Remi — Buon compleanno ✨</title>
<style>
:root{--rose:#f4a7c6;--pale:#ffe0ed;--gold:#e9c68b;--ink:#1a0d1c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(ellipse at 50% 0%,#63334f 0%,#2a172e 42%,#100b18 100%);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.panel{width:min(760px,100%);padding:clamp(28px,6vw,66px);text-align:center;border:1px solid #f8d8e64d;border-radius:28px;background:linear-gradient(145deg,#ffffff18,#ffffff08);box-shadow:0 25px 90px #0008,inset 0 1px #ffffff24;backdrop-filter:blur(18px);animation:rise 1s ease both}
.kicker{font:700 .7rem/1.4 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(3rem,10vw,6.4rem);line-height:.94;letter-spacing:-.055em;margin:22px 0 18px;color:#ffe8f0;text-shadow:0 4px 30px #f49cbe55}
h1 span{display:block;font-style:italic;color:var(--rose);font-size:.72em;margin-top:12px}
.copy{max-width:530px;margin:0 auto;color:#f6eaf0;font-size:clamp(1.05rem,2.6vw,1.25rem);line-height:1.8}
.divider{height:1px;width:100px;margin:28px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
button{border:0;border-radius:999px;padding:15px 25px;font:700 .92rem system-ui,sans-serif;cursor:pointer;transition:transform .2s,filter .2s}
button:hover{transform:translateY(-3px);filter:brightness(1.08)}
.primary{color:#321725;background:linear-gradient(110deg,#f7b7d0,#f5d8df 55%,#e9c68b);box-shadow:0 9px 30px #e88bb944}
.secondary{color:#fff;background:#ffffff12;border:1px solid #ffffff3d}
#introActions{margin-top:32px}
#giftScene{display:none;margin-top:34px;animation:rise .7s ease both}
#giftScene.show{display:block}
.giftButton{background:transparent;border:0;padding:0;color:inherit;display:grid;justify-items:center;gap:10px;margin:auto}
.giftIcon{font-size:78px;filter:drop-shadow(0 10px 18px #f08ab966);animation:bob 2.5s ease-in-out infinite}
.hint{font: .78rem system-ui,sans-serif;color:#e7cbd9;letter-spacing:.08em}
.watchReveal{display:none;margin:26px auto 0;max-width:560px;padding:22px 18px 26px;border:1px solid #f6c8dc55;border-radius:22px;background:#160d1caa;animation:rise .8s ease both}
.watchReveal.show{display:block}
.watchTitle{font-size:1.65rem;color:#ffe3ee;margin:0 0 8px}
.watchSub{font: .88rem/1.6 system-ui,sans-serif;color:#e9d7e1;margin:0 auto 16px}
.watch{width:min(280px,78vw);height:auto;display:block;margin:4px auto 14px;filter:drop-shadow(0 15px 24px #0008)}
.note{font-size:1rem;line-height:1.7;color:#f6e8ef;max-width:440px;margin:12px auto 0}
footer{margin-top:32px;font: .65rem system-ui,sans-serif;color:#c9aebc;letter-spacing:.2em}
.spark{position:fixed;z-index:4;pointer-events:none;animation:burst 1.5s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.5)}18%{opacity:1}100%{opacity:0;transform:translate(var(--x),-120px) rotate(35deg) scale(1.3)}}

/* Birthday effects */
.floating-heart{position:fixed;z-index:2;pointer-events:none;animation:heartFloat 5s linear forwards;opacity:0;color:#ffb5d0;text-shadow:0 0 14px #ff8bb8}
@keyframes heartFloat{0%{transform:translateY(20px) scale(.7) rotate(-10deg);opacity:0}12%{opacity:.9}100%{transform:translateY(-110vh) scale(1.35) rotate(18deg);opacity:0}}
.confetti-piece{position:fixed;z-index:5;top:-16px;pointer-events:none;width:8px;height:13px;border-radius:2px;animation:confettiFall var(--duration) linear forwards;transform:rotate(var(--rot))}
@keyframes confettiFall{to{transform:translate(var(--drift),110vh) rotate(780deg);opacity:.15}}
.balloon{position:fixed;z-index:2;bottom:-130px;pointer-events:none;width:48px;height:60px;border-radius:50% 50% 46% 46%;background:var(--balloon);box-shadow:inset -8px -8px 0 #00000012;animation:balloonUp var(--duration) ease-in forwards}
.balloon:after{content:'';position:absolute;left:22px;bottom:-48px;width:1px;height:50px;background:#fff9}
.balloon:before{content:'';position:absolute;left:19px;bottom:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--balloon)}
@keyframes balloonUp{to{transform:translate(var(--drift),-125vh) rotate(12deg);opacity:.1}}
.firework{position:fixed;z-index:6;pointer-events:none;width:5px;height:5px;border-radius:50%;box-shadow:0 0 12px currentColor;animation:fireworkPop 1.1s ease-out forwards}
@keyframes fireworkPop{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(18)}}
.watchPhoto{display:block;width:min(100%,390px);max-height:390px;object-fit:contain;margin:14px auto 18px;border-radius:18px;background:transparent;padding:0;box-shadow:0 12px 35px #0005}
.watchCredit{font: .72rem/1.5 system-ui,sans-serif;color:#cdb5c2;margin:8px auto 0}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<main>

  <div class="kicker">✦ una giornata tutta tua ✦</div>
  <h1>Buon compleanno,<span>Remi</span></h1>

  <div class="divider"></div>
  <p class="copy">Che tu possa brillare ogni giorno, proprio come meriti. 💗</p>

<script>
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let stars=[];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:105},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.25,a:Math.random()*.65+.15,p:Math.random()*6.28}))}
function draw(t=0){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){ctx.globalAlpha=s.a*(.65+.35*Math.sin(t/950+s.p));ctx.fillStyle='#fff4f8';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
function burst(){
  const icons=['✨','💗','🌸','⭐','💫'];
  for(let i=0;i<42;i++){const el=document.createElement('span');el.className='spark';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=(innerWidth/2+(Math.random()*160-80))+'px';el.style.top=(innerHeight*.56)+'px';el.style.setProperty('--x',(Math.random()*300-150)+'px');el.style.fontSize=(13+Math.random()*18)+'px';document.body.append(el);setTimeout(()=>el.remove(),1600)}
  confetti(85); balloons(7); fireworks(5);
}
function confetti(count=55){const colors=['#ff9fc5','#ffd8e7','#f6d58e','#ffffff','#d9b9ff'];for(let i=0;i<count;i++){const el=document.createElement('i');el.className='confetti-piece';el.style.left=Math.random()*100+'vw';el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.setProperty('--duration',(3+Math.random()*3)+'s');el.style.setProperty('--drift',(Math.random()*220-110)+'px');el.style.setProperty('--rot',(Math.random()*180)+'deg');document.body.append(el);setTimeout(()=>el.remove(),6500)}}
function balloons(count=5){const colors=['#f4a7c6','#e9b8dc','#ffd98a','#f8dce8','#c8b4ff'];for(let i=0;i<count;i++){const el=document.createElement('i');el.className='balloon';el.style.left=(Math.random()*92)+'vw';el.style.setProperty('--balloon',colors[i%colors.length]);el.style.setProperty('--duration',(7+Math.random()*5)+'s');el.style.setProperty('--drift',(Math.random()*120-60)+'px');document.body.append(el);setTimeout(()=>el.remove(),12500)}}
function fireworks(count=4){for(let i=0;i<count;i++){setTimeout(()=>{const el=document.createElement('i');el.className='firework';el.style.left=(12+Math.random()*76)+'vw';el.style.top=(12+Math.random()*48)+'vh';el.style.color=['#ffb4d0','#ffe4a6','#e7c5ff','#ffffff'][i%4];document.body.append(el);setTimeout(()=>el.remove(),1200)},i*260)}}
function floatingHearts(){setInterval(()=>{const el=document.createElement('span');el.className='floating-heart';el.textContent=['♡','♥','✧'][Math.floor(Math.random()*3)];el.style.left=Math.random()*100+'vw';el.style.bottom='-30px';el.style.fontSize=(15+Math.random()*18)+'px';document.body.append(el);setTimeout(()=>el.remove(),5200)},900)}
floatingHearts();
document.getElementById('continue').addEventListener('click',()=>{document.getElementById('giftScene').classList.add('show');document.getElementById('introActions').style.display='none';burst();document.getElementById('giftScene').scrollIntoView({behavior:'smooth',block:'center'})});
document.getElementById('gift').addEventListener('click',()=>{document.getElementById('watchReveal').classList.add('show');document.querySelector('.giftIcon').textContent='💝';burst();confetti(110);balloons(10);fireworks(9);document.getElementById('watchReveal').scrollIntoView({behavior:'smooth',block:'center'})});
</script>
